[project]
name = "oilcast"
version = "2.0.0"
description = "Brent crude oil forecasting: AR(12) vs baselines with rolling-origin backtests"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "statsmodels>=0.14", "plotly>=5.18",
                "fastapi>=0.110", "pydantic>=2.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oilcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
